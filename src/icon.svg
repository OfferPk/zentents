<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b3824"/>
      <stop offset="60%" stop-color="#0e1f13"/>
      <stop offset="100%" stop-color="#070e09"/>
    </radialGradient>
    <linearGradient id="tent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tentShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle Forest Ground Line -->
  <path d="M 32 400 Q 256 420 480 400" stroke="#1f4228" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Pine Tree Left -->
  <g transform="translate(130, 160)">
    <!-- Tree Trunk -->
    <rect x="-14" y="160" width="28" height="60" rx="6" fill="#78350f"/>
    <!-- Foliage Layers -->
    <polygon points="0,0 -80,90 -25,90 -95,150 95,150 25,90 80,90" fill="url(#treeGrad)" filter="url(#glow)"/>
    <polygon points="0,-15 -60,65 -20,65 -75,120 75,120 20,65 60,65" fill="#10b981" opacity="0.4"/>
  </g>

  <!-- Cozy Camping Tent Right -->
  <g transform="translate(320, 240)">
    <!-- Tent Glow Base -->
    <ellipse cx="20" cy="140" rx="90" ry="18" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>

    <!-- Left Tent Wall -->
    <polygon points="10,0 -90,140 30,140" fill="url(#tent)" filter="url(#glow)"/>

    <!-- Tent Entrance Opening -->
    <polygon points="10,0 30,140 100,140" fill="url(#tentShadow)"/>
    <polygon points="10,0 45,140 85,140" fill="#451a03"/>

    <!-- Tent Pegs & Ropes -->
    <line x1="10" y1="0" x2="-105" y2="148" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="115" y2="148" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Warm Starlight Sparkles -->
  <circle cx="390" cy="110" r="4" fill="#fef08a" opacity="0.8" filter="url(#glow)"/>
  <circle cx="260" cy="80" r="3" fill="#fef08a" opacity="0.6"/>
  <circle cx="110" cy="100" r="2.5" fill="#fef08a" opacity="0.7"/>
</svg>
